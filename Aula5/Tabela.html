<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Notas dos Alunos</title>
    <style>
        table {
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 5px;
            text-align: center;
        }
        th {
            background-color: #b5b5b5;
        }
        .aluno {
            background-color: #ffcbdb;
        }
        .total {
            background-color: #d3f8d3;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2 align="center">Notas dos Alunos</h2>
    <center>
    <table id="tabelaNotas">
        <tr>
            <th rowspan="2">Aluno</th>
            <th colspan="3">Semestre 1</th>
            <th colspan="3">Semestre 2</th>
            <th colspan="3">Semestre 3</th>
        </tr>
        <tr>
            <th>Nota 1</th>
            <th>Nota 2</th>
            <th>Nota 3</th>
            <th>Nota 1</th>
            <th>Nota 2</th>
            <th>Nota 3</th>
            <th>Nota 1</th>
            <th>Nota 2</th>
            <th>Nota 3</th>
        </tr>
        <tr>
            <td class="aluno">João</td>
            <td>10</td><td>8</td><td>9</td>
            <td>6</td><td>8</td><td>10</td>
            <td>6</td><td>7</td><td>9</td>
        </tr>
        <tr>
            <td class="aluno">Maria</td>
            <td>7</td><td>6</td><td>8</td>
            <td>9</td><td>8</td><td>7</td>
            <td>8</td><td>9</td><td>10</td>
        </tr>
        <tr>
            <td class="aluno">José</td>
            <td>5</td><td>7</td><td>6</td>
            <td>8</td><td>7</td><td>9</td>
            <td>6</td><td>5</td><td>7</td>
        </tr>
        <tr>
            <td class="aluno">Paulo</td>
            <td>9</td><td>10</td><td>8</td>
            <td>7</td><td>9</td><td>6</td>
            <td>10</td><td>8</td><td>7</td>
        </tr>
        <tr>
            <td class="aluno">Miguel</td>
            <td>6</td><td>5</td><td>7</td>
            <td>8</td><td>6</td><td>7</td>
            <td>9</td><td>10</td><td>8</td>
        </tr>
        <tr>
            <td class="aluno">Julia</td>
            <td>8</td><td>9</td><td>10</td>
            <td>7</td><td>6</td><td>8</td>
            <td>10</td><td>9</td><td>7</td>
        </tr>
    </table>
    <br>
    <button onclick="adicionarLinhaTotal()">Adicionar Linha Totalizadora</button>
    <button onclick="adicionarColunaTotal()">Adicionar Coluna Totalizadora</button>
    </center>

    <!-- Importar o JavaScript separado -->
    <script src="script_tabela.js"></script>
</body>
</html>
